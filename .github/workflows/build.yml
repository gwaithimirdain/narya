name: "Build"

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    - run: nix profile install nixpkgs#cachix
    - run: env CACHIX_AUTH_TOKEN=${{ secrets.CACHIX_AUTH_TOKEN }} cachix watch-exec narya -- nix develop --accept-flake-config . --command dune test
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    - run: nix profile install nixpkgs#cachix
    - run: env GIT_COMMIT=${GITHUB_SHA:0:8} CACHIX_AUTH_TOKEN=${{ secrets.CACHIX_AUTH_TOKEN }} cachix watch-exec narya -- nix build --impure --accept-flake-config .
    - run: cd dist && ./build.sh
    - uses: actions/upload-artifact@v4
      with:
        name: narya-master-static
        path: dist/build/releases/narya-master-static.tar.gz
  build-macos:
    # MacOS doesn't support fully static executables, but a binary that
    # dynamically links only system libraries runs on any MacOS at least as
    # new as its deployment target.  Narya's only other C dependency is GMP
    # (through zarith), so we link a static build of it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      GMP_VERSION: "6.3.0"
    steps:
    - uses: actions/checkout@v4
    - run: echo "GMP_PREFIX=$RUNNER_TEMP/gmp-static" >> "$GITHUB_ENV"
    - name: Cache static GMP
      id: cache-gmp
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/gmp-static
        key: gmp-${{ env.GMP_VERSION }}-static-pic-${{ matrix.runner }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}
    - name: Build static GMP
      if: steps.cache-gmp.outputs.cache-hit != 'true'
      working-directory: ${{ runner.temp }}
      run: |
        # GNU mirrors are sometimes slow or unreachable, so try several sources.
        for url in "https://ftpmirror.gnu.org/gmp/gmp-$GMP_VERSION.tar.xz" \
                   "https://ftp.gnu.org/gnu/gmp/gmp-$GMP_VERSION.tar.xz" \
                   "https://gmplib.org/download/gmp/gmp-$GMP_VERSION.tar.xz"; do
          if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 "$url" -o gmp.tar.xz; then
            break
          fi
          echo "Download from $url failed"
          rm -f gmp.tar.xz
        done
        tar -xf gmp.tar.xz
        cd "gmp-$GMP_VERSION"
        # --with-pic is needed on x86_64, where GMP's assembly is otherwise
        # position-dependent and can't be linked into zarith's shared library.
        ./configure --prefix="$GMP_PREFIX" --disable-shared --enable-static --with-pic
        make -j"$(sysctl -n hw.ncpu)"
        make install
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: "5.3"
    - run: opam install dune --yes
    - run: opam exec -- dune build narya.opam
    - name: Install dependencies, with zarith using the static GMP
      run: |
        # zarith takes its GMP link flags from pkg-config, and records them
        # for linking executables, so this keeps Homebrew's libgmp.dylib
        # (if present) out of the final link.
        export PKG_CONFIG_PATH="$GMP_PREFIX/lib/pkgconfig"
        export CPPFLAGS="-I$GMP_PREFIX/include" LDFLAGS="-L$GMP_PREFIX/lib"
        opam install . --deps-only --yes
    - run: opam exec -- dune build -p narya
    - name: Check that only system libraries are linked dynamically
      run: |
        BIN=_build/install/default/bin/narya
        otool -L "$BIN"
        vtool -show-build "$BIN"
        extra=$(otool -L "$BIN" | tail -n +2 | grep -v -E '^[[:space:]]*(/usr/lib/|/System/Library/)' || true)
        if [ -n "$extra" ]; then
          echo "::error::narya links non-system dynamic libraries:"
          echo "$extra"
          exit 1
        fi
    - name: Smoke test
      run: |
        BIN=_build/install/default/bin/narya
        "$BIN" -version
        "$BIN" -e 'def A : Type := Type' -e 'echo A'
    - uses: actions/upload-artifact@v4
      with:
        name: narya-macos-${{ matrix.arch }}
        path: _build/install/default/bin/narya
  package-macos:
    needs: build-macos
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: narya-macos-*
        path: binaries
    - name: Combine into a universal binary
      run: |
        lipo -create binaries/narya-macos-arm64/narya binaries/narya-macos-x86_64/narya -output narya-universal
        chmod +x narya-universal
        lipo -info narya-universal
        ./narya-universal -e 'def A : Type := Type' -e 'echo A'
        arch -x86_64 ./narya-universal -e 'def A : Type := Type' -e 'echo A'
    - run: cd dist && ./build.sh ../narya-universal macos INSTALL-macos.txt
    - uses: actions/upload-artifact@v4
      with:
        name: narya-master-macos
        path: dist/build/releases/narya-master-macos.tar.gz
  pages:
    # The Linux and MacOS releases are published together, so that they stay
    # in sync: if either fails to build, neither is deployed.
    needs: [build, package-macos]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: narya-master-*
        path: site/releases
        merge-multiple: true
    - run: ls -l site/releases
    - name: Upload static files as artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/
  deploy:
    if: github.event_name == 'push' && github.ref_name == 'master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: pages
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
